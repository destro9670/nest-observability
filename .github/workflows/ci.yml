name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20'
          - '22'
        nest-version:
          - '10'
          - '11'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS compatibility target
        run: npm install --no-save --package-lock=false "@nestjs/common@^${{ matrix.nest-version }}.0.0" "@nestjs/core@^${{ matrix.nest-version }}.0.0" "@nestjs/testing@^${{ matrix.nest-version }}.0.0"

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
